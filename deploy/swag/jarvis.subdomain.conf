## Jarvis — copy to <swag config>/nginx/proxy-confs/jarvis.subdomain.conf
## Requires "jarvis" in SWAG's SUBDOMAINS (or a wildcard cert) and a DNS record for jarvis.keeeys.uk.

server {
    listen 443 ssl;
    listen [::]:443 ssl;

    server_name jarvis.*;

    include /config/nginx/ssl.conf;

    client_max_body_size 5m;

    location / {
        include /config/nginx/proxy.conf;
        include /config/nginx/resolver.conf;
        set $upstream_app jarvis;
        set $upstream_port 8080;
        set $upstream_proto http;
        proxy_pass $upstream_proto://$upstream_app:$upstream_port;

        # stream chat replies as they are generated
        proxy_buffering off;
        proxy_read_timeout 300s;
    }
}
